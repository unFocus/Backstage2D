[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = ""

[workspace.dependencies]
backstage_core = { path = "crates/backstage_core" }
backstage_protocol = { path = "crates/backstage_protocol" }
backstage_render = { path = "crates/backstage_render" }
backstage_script = { path = "crates/backstage_script" }

anyhow = "1.0.104"
getrandom = "0.4.3"
glam = { version = "0.33.11", features = ["serde"] }
lyon = "1.0.19"
ron = "0.12.2"
thiserror = "2.0.21"
bytemuck = { version = "1.25", features = ["derive"] }
memmap2 = "0.9.11"
pollster = "1.0.1"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
wgpu = "30.0.1"

# Test-only.
image = { version = "0.25.10", default-features = false, features = ["png"] }
insta = "1.48.0"
proptest = "1.11.0"
serde_json = "1.0.151"

# Tools (GUI) only. Runtime-side crates must not depend on these.
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
relm4 = "0.11.0"
